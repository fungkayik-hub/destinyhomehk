<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="Destiny Home">
  <defs>
    <linearGradient id="gold" x1="40" y1="40" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8C55A"/>
      <stop offset="1" stop-color="#C9A96E"/>
    </linearGradient>
    <radialGradient id="glow" cx="100" cy="92" r="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C9A96E" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C9A96E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="96" fill="#0F1A33"/>
  <circle cx="100" cy="100" r="96" fill="url(#glow)"/>
  <circle cx="100" cy="100" r="94" stroke="url(#gold)" stroke-width="2.5" opacity="0.95"/>

  <!-- Constellation arc -->
  <path
    d="M58 128 C72 142, 128 142, 142 128"
    stroke="#C9A96E"
    stroke-width="1.75"
    stroke-linecap="round"
    opacity="0.45"
  />

  <!-- Orbit dots -->
  <circle cx="62" cy="118" r="2.2" fill="#E8C55A" opacity="0.85"/>
  <circle cx="82" cy="132" r="1.8" fill="#C9A96E" opacity="0.7"/>
  <circle cx="118" cy="132" r="1.8" fill="#C9A96E" opacity="0.7"/>
  <circle cx="138" cy="118" r="2.2" fill="#E8C55A" opacity="0.85"/>

  <!-- Home roof -->
  <path
    d="M54 118 L100 68 L146 118"
    stroke="url(#gold)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Door / foundation -->
  <path
    d="M88 118 V138 C88 141, 112 141, 112 138 V118"
    stroke="#C9A96E"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.75"
  />

  <!-- Purple Star (+®) -->
  <path
    d="M100 86 L103.2 96.8 L114.5 96.8 L105.6 103.4 L108.8 114.2 L100 107.6 L91.2 114.2 L94.4 103.4 L85.5 96.8 L96.8 96.8 Z"
    fill="url(#gold)"
  />
  <circle cx="100" cy="100.5" r="3.2" fill="#0F1A33"/>
  <circle cx="100" cy="100.5" r="1.6" fill="#E8C55A"/>
</svg>
